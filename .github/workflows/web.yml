name: Web tests
on:
  push:
    paths: ["web/**", "schema/**", "SampleApp/graph.json", ".github/workflows/web.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # `build` runs tsc first, so this also type-checks.
      - run: npm run build
        working-directory: web
